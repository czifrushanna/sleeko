{{- if and .Values.sleeko.enabled (not .Values.sleeko.llmgw.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "harbor.sleeko" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{ include "harbor.labels" . | indent 4 }}
type: Opaque
data:
  LLMGW_API_KEY: {{ .Values.sleeko.llmgw.apiKey | default "" | b64enc | quote }}
  LLMGW_API_BASE_URL: {{ .Values.sleeko.llmgw.apiBaseURL | default "" | b64enc | quote }}
  LLMGW_MODEL: {{ .Values.sleeko.llmgw.model | default "" | b64enc | quote }}
{{- end }}

{{ if .Values.sleeko.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ template "harbor.sleeko" . }}"
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{ include "harbor.labels" . | indent 4 }}
spec:
{{- if .Values.ipFamily.policy }}
  ipFamilyPolicy: {{ .Values.ipFamily.policy }}
{{- end }}
{{- if .Values.ipFamily.families }}
  ipFamilies: {{ toYaml .Values.ipFamily.families | nindent 4 }}
{{- end }}
  ports:
    - name: http-sleeko
      protocol: TCP
      port: {{ template "harbor.sleeko.servicePort" . }}
  selector:
{{ include "harbor.matchLabels" . | indent 4 }}
    component: sleeko
{{ end }}

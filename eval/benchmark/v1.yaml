# Benchmark items that built, passed their smoke test and measured cleanly
# with a no-op pipeline on 2026-10-15 (trivy 0.75.0 db 2026-10-13T13:06:33.602531196Z). Selected by eval/benchmark/import/select
# from candidates/demo.yaml (all 14) and candidates/d3.yaml (91 of 113; the
# other 22 are multi-GB ML/CUDA images, not tried). d3-dgtlmoon-changedetection-io
# also passed but was left out: its O′ build took 12m50s, over the ~10 minute
# limit for v1. Heavy items (omnigres, unitycatalog) need the Docker VM's memory
# to themselves: run them at --concurrency 1, or give Docker more than 8 GB.
items:
    - id: demo-flask
      source: demo
      repo: https://github.com/docker/awesome-compose
      commit: 30f4b7f6a6c3b0c0ecf4d4efb0de203c48d11562
      context: flask/app
      dockerfile: flask/app/Dockerfile
      platform: linux/amd64
      target: builder
      smoke:
        command:
            - -c
            - import app
        timeout: 2m0s
      distro_family: alpine
      language: python

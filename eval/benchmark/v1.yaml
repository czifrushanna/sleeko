# Benchmark items that built, passed their smoke test and measured cleanly
# with a no-op pipeline on 2026-10-15 (trivy 0.75.0 db 2026-10-13T13:06:33.602531196Z). Selected by eval/benchmark/import/select:
#   -keep (the earlier 28 items) -target 60 -max-per-language 9
#   -exclude f4d-decc-twenty-fifty-new-look,d3-dgtlmoon-changedetection-io
# over candidates/demo.yaml (14), d3.yaml (91 of 113 filtered; 22 ML/CUDA
# images not tried) and flake4dock.yaml (99 of 206 filtered, chosen for
# variety). Choices favour variety over volume: new items come from the
# language with the fewest items, then the distro family with the fewest.
# Left out on purpose:
# - images that scan with no findings although not FROM scratch: Trivy has no
#   advisories for them (Ubuntu 14.04) or cannot read their package database;
# - f4d-decc-twenty-fifty-new-look: Ubuntu 16.04, whose OS packages Trivy does
#   not cover (a bare ubuntu:16.04 scans with 0 findings);
# - d3-dgtlmoon-changedetection-io: O′ build took 12m50s, over the ~10 min limit.
# Heavy items (omnigres, unitycatalog) need the Docker VM's memory to
# themselves: run them at --concurrency 1, or give Docker more than 8 GB.
items:

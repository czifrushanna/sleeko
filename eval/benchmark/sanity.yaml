# Two real items for the harness's no-op sanity check (C = O must give
# ΔV = 0, ΔS ≈ 0 and pass every gate). Not part of the benchmark itself.
#
#   sleeko-eval run --manifest eval/benchmark/sanity.yaml --pipeline noop --reps 1
items:
  - id: awesome-compose-flask
    source: demo
    repo: https://github.com/docker/awesome-compose
    commit: 30f4b7f6a6c3b0c0ecf4d4efb0de203c48d11562
    context: flask/app
    dockerfile: flask/app/Dockerfile
    # The final stage (dev-envs) adds developer tooling; builder is the app.
    target: builder
    distro_family: alpine
    smoke:
      # Imports the app module without starting the server.
      command: ["-c", "import app"]
      exit_code: 0

  - id: awesome-compose-express-backend
    source: demo
    repo: https://github.com/docker/awesome-compose
    commit: 30f4b7f6a6c3b0c0ecf4d4efb0de203c48d11562
    context: react-express-mongodb/backend
    dockerfile: react-express-mongodb/backend/Dockerfile
    target: development
    distro_family: debian
    smoke:
      command: ["node", "-e", "require('express'); require('mongoose')"]
      exit_code: 0

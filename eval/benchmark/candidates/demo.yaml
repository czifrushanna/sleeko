# Demo candidates: a hand-written list from docker/awesome-compose, pinned to
# one commit. Most are services, so the smoke test is the generic "container
# starts and keeps running for 10s" one. Not yet filtered: distro_family is
# filled in by eval/benchmark/import/select from what Trivy detects.
items:
  - id: demo-flask
    source: demo
    repo: https://github.com/docker/awesome-compose
    commit: 30f4b7f6a6c3b0c0ecf4d4efb0de203c48d11562
    context: flask/app
    dockerfile: flask/app/Dockerfile
    target: builder
    distro_family: unknown
    language: python
    smoke:
      command: ["-c", "import app"]

  - id: demo-express-backend
    source: demo
    repo: https://github.com/docker/awesome-compose
    commit: 30f4b7f6a6c3b0c0ecf4d4efb0de203c48d11562
    context: react-express-mongodb/backend
    dockerfile: react-express-mongodb/backend/Dockerfile
    target: development
    distro_family: unknown
    language: javascript
    smoke:
      command: ["node", "-e", "require('express'); require('mongoose')"]

  - id: demo-django
    source: demo
    repo: https://github.com/docker/awesome-compose
    commit: 30f4b7f6a6c3b0c0ecf4d4efb0de203c48d11562
